<!-- DISPLAY ONLY - not a cut file.
     The stroke is thickened, a light ground painted in, and the lightest inks
     darkened: green, cyan and orange sit below the 3:1 graphics minimum against any
     light background, so the cut order cannot be read from a faithful rendering. Hue
     and sequence are unchanged. Geometry and sheet position are untouched, and the
     CUT FILE keeps the exact values your laser keys on.
     Cut the file in the repository root, not this one. -->
  <rect x="0.0" y="0.0" width="480.47" height="36.15" fill="#faf7f0"/>
<title>Ribbon bore, dspiral - the wall panels - 10mm square bore, 30 degree facets</title>
<desc>1 user unit = 1mm. the wall panels. A duct of constant 10 x 10mm section swept along a planar curve; the two cheeks are the same part and both go on the same way up. 20 wall panels in all, numbered along the flow. The airway is exact along every facet and 3.5% over at each mitre. 3mm ply, slots cut for a 3mm sheet at 0.15mm kerf, 0.025mm play per side taken out of the slot and never off the tab. NARROW: the cheek is only as wide as the duct, so every mortice is open at the rim and each tab is held across its thickness on one side only. blue #0000ff engraves, orange #ff8000 cuts the slots first, black #000000 frees the parts.</desc>
