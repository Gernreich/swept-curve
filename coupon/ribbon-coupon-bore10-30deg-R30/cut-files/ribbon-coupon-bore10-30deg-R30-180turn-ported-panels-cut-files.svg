<svg xmlns="http://www.w3.org/2000/svg" width="318.33mm" height="36.10mm" viewBox="0 0 318.33 36.10">
<title>Ribbon bore, coupon - the wall panels - 10mm square bore, 30 degree facets</title>
<desc>1 user unit = 1mm. the wall panels. A duct of constant 10 x 10mm section swept along a planar curve; the two cheeks are the same part and both go on the same way up. 16 wall panels in all, numbered along the flow. The airway is exact along every facet and 3.5% over at each mitre. 3mm ply, 0.1mm kerf, 0.025mm play per side taken out of the slot and never off the tab. blue #0000ff engraves, orange #ff8000 cuts the slots first, black #000000 frees the parts.</desc>
