[package]
name = "swept-curve"
version = "0.1.0"
edition = "2021"
authors = ["Michael Gernreich", "Claude (Anthropic) <noreply@anthropic.com>"]
description = "Laser-cut bores of constant square section swept along a planar curve"
license-file = "LICENSE"
publish = false
autobins = false

# The library is the generator, and the Rust generators beside this checkout
# borrow its path writer by path; each program in bin/ is one main(). Rust
# since 2026-11-07, Python until then: the move changed no byte of any file.
[lib]
name = "ribbon_bore"
path = "ribbon_bore.rs"

[[bin]]
name = "ribbon_bore"
path = "bin/ribbon_bore.rs"

[[bin]]
name = "ribbon_view"
path = "bin/ribbon_view.rs"

[[bin]]
name = "volute"
path = "volute/volute.rs"

[dependencies]
lasermade-tools = { path = "../lasermade-tools" }
