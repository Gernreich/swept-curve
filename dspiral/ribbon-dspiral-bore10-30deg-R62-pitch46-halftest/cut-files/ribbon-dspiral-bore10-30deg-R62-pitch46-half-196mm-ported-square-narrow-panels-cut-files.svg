<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="492.32mm" height="36.15mm" viewBox="0 0 492.32 36.15">
<title>Ribbon bore, dspiral - the wall panels - 10mm square bore, 30 degree facets</title>
<desc>1 user unit = 1mm. the wall panels. A duct of constant 10 x 10mm section swept along a planar curve; the two cheeks are the same part and both go on the same way up. 18 wall panels in all, numbered along the flow. The airway is exact along every facet and 3.5% over at each mitre. 3mm ply, slots cut for a 3mm sheet at 0.15mm kerf, 0.025mm play per side taken out of the slot and never off the tab. NARROW: the cheek is only as wide as the duct, so every mortice is open at the rim and each tab is held across its thickness on one side only. The plain 16mm square on the panels sheet is the end cap: it glues over the open end of the duct so the air turns into the port, it carries no number, and ONE is needed. blue #0000ff engraves, orange #ff8000 cuts the slots first, black #000000 frees the parts.</desc>
